<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore Earth with the free and open source FOSS Earth globe." />
    <title>FOSS Earth</title>
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <link rel="stylesheet" href="/landing.css" />
    <!-- Registers the app's worker while this page is read, so Open the globe loads it isolated, for its shared memory, without the first visit's reload. -->
    <script src="/app/foss-earth-isolate.js" async></script>
    <script>
      // The app used to be served here, so old links to it can land on this page.
      // Its links carry their state in the query or hash: open those in the app.
      if (location.search || location.hash) location.replace('/app/' + location.search + location.hash)
    </script>
  </head>
  <body>
    <main>
      <p class="eyebrow">Free and open source</p>
      <h1>FOSS Earth</h1>
      <p class="intro">Explore our planet, its landscapes and immersive scenes.</p>
      <a class="launch" href="/app/">Open the globe <span aria-hidden="true">↗</span></a>
      <p class="source">Built in the open. <a href="https://github.com/foss-earth/app">Explore the source</a>.</p>
    </main>
    <footer>
      <a href="https://github.com/foss-earth/foss-earth.github.io">Landing-page source</a>
      <a href="https://github.com/foss-earth/docs">Project documentation</a>
    </footer>
  </body>
</html>
